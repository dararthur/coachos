name: CI

on:
  push:
    branches: [main, "product/**", "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Types, lint, tests unitaires, secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run audit:secrets

  database:
    name: Tests de base de données (RLS, isolation, RGPD) sur PostgreSQL réel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run test:db

  e2e:
    name: Tests end-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  postgres-migrations:
    name: Migrations rejouées sur PostgreSQL 17 standard (deux fois, depuis zéro)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-jetable-sans-valeur
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: ci-jetable-sans-valeur
    steps:
      - uses: actions/checkout@v4
      - name: Rejouer toutes les migrations sur deux bases vierges (reproductibilité)
        run: |
          for db in coachos_a coachos_b; do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -c "create database $db"
            for f in db/migrations/*.sql; do
              echo "== $db : $f"
              psql -h localhost -U postgres -d "$db" -v ON_ERROR_STOP=1 -q -f "$f"
            done
          done
      - name: Invariants de sécurité (RLS partout, rôles sans privilège excessif, tables d'authentification fermées)
        run: |
          q() { psql -h localhost -U postgres -d coachos_a -tAq -c "$1"; }
          test "$(q "select count(*) from pg_tables where schemaname = 'public' and not rowsecurity")" = "0"
          test "$(q "select count(*) from pg_roles where rolname in ('app_server','auth_runtime','anon','authenticated') and (rolsuper or rolbypassrls or rolcreaterole or rolcreatedb)")" = "0"
          test "$(q "select count(*) from information_schema.role_table_grants where table_schema = 'auth' and grantee not in ('auth_runtime','postgres')")" = "0"
          test "$(q "select count(*) from pg_tables where schemaname = 'auth'")" = "4"
