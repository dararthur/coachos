# Configuration de la pile Supabase LOCALE (supabase start). Aucun secret ici.
# Vérifiée uniquement par relecture : Docker est requis pour `supabase start` (voir docs/setup.md).
project_id = "coachos"

[api]
enabled = true
port = 54321
# L'application n'utilise pas l'API de données (PostgREST) : tout passe par des transactions SQL soumises à la RLS.
# En production, désactiver aussi la Data API du projet (Settings > API) pour réduire la surface d'attaque.
schemas = ["public"]
extra_search_path = []
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback", "http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
# Confirmation obligatoire : une invitation ne peut être acceptée que par une adresse confirmée.
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "60s"

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
token_refresh = 150

# Boîte mail de développement : http://127.0.0.1:54324 (Inbucket)
[inbucket]
enabled = true
port = 54324
