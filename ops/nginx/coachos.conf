# Coach OS — hôte virtuel Nginx. EXEMPLE AUTONOME, NON APPLIQUÉ, NON VALIDÉ sur un serveur réel.
#
#   - Aucune modification de configuration globale : ce fichier est SÉPARÉ (ex. /etc/nginx/conf.d/coachos.conf), inclus dans le contexte
#     `http` par la configuration standard. Ses directives de niveau `http` (log_format, map, limit_req_zone, upstream) portent toutes le
#     préfixe « coachos » pour ne jamais entrer en collision avec les autres applications du serveur.
#   - Avant tout rechargement : sauvegarder la configuration existante, puis `nginx -t`, puis `nginx -s reload` (jamais de redémarrage).
#   - Placeholders à remplacer : nom de domaine, chemins des certificats, port de l'application (à choisir APRÈS inventaire des ports).
#   - Un seul émetteur de HSTS : l'APPLICATION (src/proxy.ts). Ne PAS en ajouter ici (en-tête doublé, valeurs contradictoires).
#   - Un seul émetteur de Cache-Control sur l'authentification : l'APPLICATION (no-store). Aucun proxy_cache n'est configuré ici.
#   - Documentation et limites : docs/nginx.md.

# --- Journal d'accès SANS jeton ---------------------------------------------------------------------------------------------------
# Les liens de confirmation, de réinitialisation, d'invitation et de pointage portent un jeton dans le chemin ou dans la requête.
# Ce format n'écrit JAMAIS la chaîne de requête (les variables de requête complète sont volontairement absentes) ; les chemins qui
# portent le jeton dans le CHEMIN ont en plus `access_log off`.
log_format coachos_notoken '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';

# --- Limitation de débit au niveau du proxy (en plus de celle de l'application, qui reste la référence) --------------------------
# Compteurs applicatifs (src/server/auth/factory.ts) : connexion 10 essais / 15 min par e-mail et 30 par IP ; inscription 5 / h par IP ;
# réinitialisation 3 / h par e-mail ; liens de confirmation 30 / 15 min par IP. Ceux de Nginx sont un filet de rafales par adresse.
# Attention : derrière un Wi-Fi partagé ou du CGNAT, toutes les personnes d'un même lieu partagent une adresse (docs/nginx.md).
map $request_method $coachos_post_key {
    default "";                       # clé vide = non comptée : seuls les POST (soumissions de formulaires) sont limités
    POST    $binary_remote_addr;
}
limit_req_zone $coachos_post_key zone=coachos_post:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=coachos_links:10m rate=60r/m;
limit_req_status 429;

upstream coachos_app {
    server 127.0.0.1:3100;            # PLACEHOLDER : port local de Coach OS, à choisir après inventaire (jamais supposé libre)
    keepalive 8;
}

# --- HTTP : redirection vers HTTPS, et défi ACME pour le renouvellement des certificats ----------------------------------------------
server {
    listen 80;
    server_name coachos.example.invalid;   # PLACEHOLDER
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;             # certbot certonly --webroot : ne modifie PAS la configuration Nginx
        access_log off;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ----------------------------------------------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name coachos.example.invalid;   # PLACEHOLDER
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/coachos.example.invalid/fullchain.pem;   # PLACEHOLDER
    ssl_certificate_key /etc/letsencrypt/live/coachos.example.invalid/privkey.pem;     # PLACEHOLDER
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:coachos_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Pas de liste de chiffrements personnalisée : valeurs par défaut de la version d'Nginx/OpenSSL installée (à relire en préproduction).

    access_log /var/log/nginx/coachos.access.log coachos_notoken;
    error_log  /var/log/nginx/coachos.error.log error;   # ATTENTION : le niveau error cite la ligne de requête (donc la chaîne de requête) : droits restreints, rotation courte.

    client_max_body_size 3m;           # photo/logo jusqu'à 2 Mo + enveloppe multipart, import CSV de 1 Mo ; au-delà : 413 au proxy, avant l'application
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;

    # Jeton dans le CHEMIN : aucun journal d'accès.
    location ^~ /api/auth/reset-password/ { access_log off; limit_req zone=coachos_links burst=20 nodelay; include /etc/nginx/coachos/proxy.inc; }
    location ^~ /invite/                  { access_log off; limit_req zone=coachos_links burst=20 nodelay; include /etc/nginx/coachos/proxy.inc; }
    location ^~ /checkin/                 { access_log off; limit_req zone=coachos_links burst=20 nodelay; include /etc/nginx/coachos/proxy.inc; }

    # Jeton dans la CHAÎNE DE REQUÊTE (absente du journal grâce au format ci-dessus).
    location ^~ /api/auth/                { limit_req zone=coachos_links burst=20 nodelay; include /etc/nginx/coachos/proxy.inc; }

    # Soumissions de formulaires d'authentification (Server Actions : POST sur la page).
    location ~ ^/(login|signup|forgot-password|reset-password)$ {
        limit_req zone=coachos_post burst=10 nodelay;
        include /etc/nginx/coachos/proxy.inc;
    }

    # Purge de rétention : appelée uniquement depuis le serveur lui-même (minuterie systemd), jamais depuis Internet.
    location = /api/cron/purge {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        include /etc/nginx/coachos/proxy.inc;
    }

    # Sondes : sans journal pour ne pas noyer les fichiers.
    location ~ ^/api/(live|health)$ { access_log off; include /etc/nginx/coachos/proxy.inc; }

    location / {
        include /etc/nginx/coachos/proxy.inc;
    }
}
