# Matnexa — vitrine statique www.matnexa.fr (dossier site/ du dépôt). EXEMPLE NON VALIDÉ sur un serveur réel : `nginx -t` avant tout rechargement.
#
#   - Fichier SÉPARÉ de coachos.conf (l'application, app.matnexa.fr) : aucune directive partagée, aucun upstream, aucun proxy.
#   - matnexa.fr (domaine nu) redirige en 301 vers https://www.matnexa.fr, seule adresse canonique (balises canonical, sitemap).
#   - Fichiers servis depuis /srv/matnexa-www/current (lien vers une copie datée de site/). Procédure : docs/deploy-www.md.
#   - La CSP n'autorise que les ressources du site lui-même : ni script, ni style en ligne, ni tiers. Le JSON-LD n'est pas exécuté.

# --- HTTP : défi ACME et redirection vers https://www ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name matnexa.fr www.matnexa.fr;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }
    location / {
        return 301 https://www.matnexa.fr$request_uri;
    }
}

# --- HTTPS, domaine nu : redirection permanente vers www -------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name matnexa.fr;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/www.matnexa.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.matnexa.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.matnexa.fr$request_uri;
}

# --- HTTPS, www : la vitrine ------------------------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.matnexa.fr;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/www.matnexa.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.matnexa.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /srv/matnexa-www/current;
    index index.html;
    charset utf-8;
    # Aucune donnée personnelle sur ce site : journal d'accès standard, sans chaîne de requête.
    access_log /var/log/nginx/matnexa-www.access.log;
    error_log  /var/log/nginx/matnexa-www.error.log warn;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css image/svg+xml application/xml text/plain application/manifest+json;

    # En-têtes communs (répétés dans chaque location qui ajoute ses propres en-têtes : add_header ne s'hérite pas).
    set $matnexa_csp "default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    add_header Content-Security-Policy $matnexa_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;   # sans includeSubDomains : app.matnexa.fr garde son propre émetteur

    # Pages HTML : toujours revalidées (un déploiement est visible immédiatement).
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $matnexa_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Ressources : la feuille de style porte un paramètre de version (?v=AAAAMMJJ), la police et les icônes changent rarement.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        access_log off;
    }

    location = /favicon.ico { expires 30d; access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
