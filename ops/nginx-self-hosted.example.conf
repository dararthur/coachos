# EXEMPLE NON APPLIQUÉ — aucun fichier du VPS n'a été lu ni modifié pour l'écrire. À valider par un test réel (critères N1 à N6 de
# docs/self-hosted-auth.md) avant tout pilote. Noms, ports et chemins sont des PLACEHOLDERS : vérifier qu'ils sont libres sur le serveur.
#
# Exigences de sécurité de l'application :
#   - Nginx ÉCRASE X-Real-IP et X-Forwarded-For (jamais $proxy_add_x_forwarded_for) : le client ne choisit pas son IP.
#   - TLS terminé par Nginx ; l'application n'écoute que sur 127.0.0.1 ; PostgreSQL n'est jamais exposé.
#   - SITE_URL = URL https publique exacte (cookies __Secure-, origine de confiance de l'authentification).
#   - Les jetons voyagent dans l'URL (réinitialisation, vérification, invitation, pointage) : pas de journal d'accès sur ces chemins.

server {
    listen 80;
    server_name coachos.example.invalid;            # placeholder
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name coachos.example.invalid;            # placeholder
    # ssl_certificate / ssl_certificate_key : gérés hors dépôt

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 2m;

    location ^~ /api/auth/reset-password/ { access_log off; include coachos-proxy.inc; }
    location = /api/auth/verify-email     { access_log off; include coachos-proxy.inc; }
    location ^~ /invite/                  { access_log off; include coachos-proxy.inc; }
    location ^~ /checkin/                 { access_log off; include coachos-proxy.inc; }
    location /                            { include coachos-proxy.inc; }
}

